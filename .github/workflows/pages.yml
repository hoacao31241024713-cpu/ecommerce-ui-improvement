name: Deploy static sites to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "CSS-NangCao/**"
      - "FE_NANG_CAO/**"
      - "JavaScript-Labs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R CSS-NangCao _site/
          cp -R FE_NANG_CAO _site/
          cp -R JavaScript-Labs _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
