name: Deploy static sites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R CSS-NangCao _site/
          cp -R FE_NANG_CAO _site/
          cp -R JavaScript-Labs _site/

      - name: Verify site
        run: test -n "$(find _site -type f -print -quit)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
